name: Build Wheels (Python 3.14 + nightly Rust)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        run: maturin build --release --out dist

      - name: Install wheel + stub tools
        shell: bash
        run: |
          pip install mypy
          pip install dist/*.whl

      - name: Generate stubs
        shell: bash
        run: |
          mkdir -p python_stubs
          stubgen -m screen_objects -o python_stubs

      - name: Embed stubs into package
        shell: bash
        run: |
          mkdir -p screen_objects
          cp python_stubs/screen_objects/__init__.pyi screen_objects/__init__.pyi

      - name: Rebuild wheel with stubs included
        run: maturin build --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*