[package]
name = "screen_objects"
version = "2.3.3"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "screen_objects"
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1   
lto = true
opt-level = 3


[dependencies]
pixen = { git = "https://github.com/ignat10/pixen" }
pyo3 = "0.28.3"
rayon = "1.12.0"
png = "0.18.1"
serde_json = "1.0.149"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
